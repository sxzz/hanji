name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: workers-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'production' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@main

      - name: Restore source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          # The build prunes retired files restored through this fallback key.
          key: sources-v1-${{ runner.os }}-${{ hashFiles('data/sources.lock.json') }}
          restore-keys: sources-v1-${{ runner.os }}-

      - name: Build dataset
        # Deliberately rebuilt instead of restored: raw inputs are cached, and
        # generated JSON/stroke assets must never survive a schema change.
        run: pnpm build:dataset

      - name: Restore generated fonts
        id: fonts-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/assets/fonts/*.woff2
            app/assets/fonts/fonts-*.css
          # chars.json exists here because Build dataset runs first, even
          # though the generated file is ignored by Git.
          key: fonts-v2-${{ runner.os }}-${{ hashFiles('data/sources.lock.json', 'package.json', 'pnpm-lock.yaml', 'scripts/build-fonts.ts', 'scripts/sources.ts', 'shared/links.ts', 'shared/row.ts', 'shared/types.ts', 'app/locales/*.ts', 'app/assets/data/chars.json') }}

      - name: Build fonts
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: pnpm build:fonts

      - name: Unit Test
        id: unit_test
        run: pnpm test
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Generate site
        run: pnpm generate

      - name: Upload Cloudflare Workers preview
        if: github.event_name == 'pull_request'
        id: deploy_preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias=pr-${{ github.event.pull_request.number }}

      - name: Publish GitHub preview deployment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION_PREVIEW_URL: ${{ steps.deploy_preview.outputs.deployment-url }}
        run: |
          version_host="${VERSION_PREVIEW_URL#https://}"
          preview_host="${version_host#*-}"
          test "$preview_host" != "$version_host"

          preview_url="https://pr-$PR_NUMBER-$preview_host"

          environment="preview"
          deployment_id="$(
            jq -n \
              --arg ref "$PR_HEAD_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: true,
                production_environment: false,
                description: "Cloudflare Workers preview"
              }' |
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/deployments" \
                --input - \
                --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$preview_url" \
            --arg log_url "$RUN_URL" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Workers preview is ready"
            }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --input -

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        id: deploy_production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Publish GitHub production deployment
        if: github.event_name == 'push'
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_URL: https://hanji.sxzz.moe
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          environment="production"
          deployment_id="$(
            jq -n \
              --arg ref "$DEPLOYED_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: false,
                production_environment: true,
                description: "Cloudflare Workers production"
              }' |
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/deployments" \
                --input - \
                --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$PRODUCTION_URL" \
            --arg log_url "$RUN_URL" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Workers production is ready"
            }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --input -

      - name: Fail Workflow on Unit Test Failure
        if: ${{ always() && github.event_name == 'pull_request' && steps.unit_test.outcome == 'failure' }}
        run: exit 1
